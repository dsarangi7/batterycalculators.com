name = "websites"
compatibility_date = "2026-04-15"
main = "src/worker.ts"

routes = [
  { pattern = "batterycalculators.com/*", zone_name = "batterycalculators.com" }
]

kv_namespaces = [
  { binding = "SESSION", id = "274898773e364b349546eb5c4a69006d" }
]

# html_handling can only 307 trailing-slash URLs. The worker runs first and
# answers those, plus www and missing-locale URLs, with a permanent redirect.
# Astro dev uses wrangler.astro.toml so this entry does not replace the Astro server.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
run_worker_first = true
