# Wrangler config for `astro dev` and the Cloudflare adapter build.
# `wrangler deploy` follows the generated dist/client/wrangler.json, which the
# seo-redirects integration rewrites to add the SEO worker and the apex route.
# This file stays free of `main` so prerender keeps using the Astro server.
name = "websites"
compatibility_date = "2026-04-15"

kv_namespaces = [
  { binding = "SESSION", id = "274898773e364b349546eb5c4a69006d" }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
