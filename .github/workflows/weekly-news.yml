name: Weekly Battery News

on:
  # Cron trigger DISABLED — news publishing is now manual-only.
  # To generate a draft locally: npm run news:generate -- --year YYYY --week NN
  # To publish: review files, translate to PT/ZH, then push to trigger Cloudflare deploy.
  # schedule:
  #   - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026)'
        required: false
        default: ''
      week:
        description: 'ISO week number (e.g. 39)'
        required: false
        default: ''

jobs:
  generate-draft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine week number
        id: week
        run: |
          if [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.week }}" ]; then
            YEAR="${{ github.event.inputs.year }}"
            WEEK="${{ github.event.inputs.week }}"
          else
            YEAR=$(date -u +%Y)
            WEEK=$(date -u +%V)
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "Generating draft for Year=$YEAR Week=$WEEK"

      - name: Generate draft article
        run: node scripts/generate-weekly-battery-news.mjs --year ${{ steps.week.outputs.year }} --week ${{ steps.week.outputs.week }}

      - name: Validate news
        run: node scripts/validate-news.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-draft-week-${{ steps.week.outputs.week }}
          path: src/pages/news/battery-industry-weekly-${{ steps.week.outputs.year }}-week-${{ steps.week.outputs.week }}.astro
          retention-days: 7
